; WiFi Radar — RSSI-based motion/presence detector for ESP8266
; Build:   pio run -d .                (builds the default env, esp01_1m)
;          pio run -d . -e esp12e      (4 MB boards: ESP-12E/F, NodeMCU, D1 mini)
; Flash:   pio run -d . -t upload
; Monitor: pio device monitor -p COM3 -b 115200
;
; Each env produces .pio/build/<env>/firmware-merged.bin via merge_bin.py.
;
; IMPORTANT — the env you build MUST match the flash chip you flash it to.
; On the ESP8266 the flash size is baked into the image header and the SDK
; keeps its RF-calibration / system-parameter data in the LAST sectors of
; that size. An image built for 4 MB flashed onto a 1 MB chip (bare ESP-01 /
; ESP-01S) points those sectors at addresses that don't exist, so the chip
; resets before setup() ever runs (garbled boot-ROM banner repeating on
; serial). That is why a build for `esp12e` compiles fine but never boots on
; an ESP-01. Use the esp01_1m env below for 1 MB ESP-01/ESP-01S modules.
;
; Not sure what you have? Run: esptool.py --port COM3 flash_id
; and look at "Detected flash size". 512 KB (old black ESP-01) is too small
; for this firmware (WiFiManager + web UI + SNMP) — it needs 1 MB or more.
;
; Flashing an ESP-01 needs GPIO0 held LOW while it powers up/resets, and a
; reliable 3.3 V supply (the radio draws ~300 mA peaks; USB-serial dongles
; with a weak 3.3 V regulator cause random resets/boot loops by themselves).

[platformio]
default_envs = esp01_1m

[env]
platform = espressif8266
framework = arduino

lib_deps =
  tzapu/WiFiManager @ ^2.0.17        ; on-device WiFi setup portal, saved to flash
  bblanchon/ArduinoJson @ ^6.21.5    ; config.json read/write
  https://github.com/0neblock/Arduino_SNMP.git  ; SNMPv2c agent (read-only OIDs for Zabbix etc.)

board_build.filesystem = littlefs    ; config.json lives in LittleFS, not SPIFFS

upload_protocol = esptool
upload_port = COM3
upload_speed = 115200     ; conservative for FTDI; bump to 460800 later if you like

monitor_port = COM3
monitor_speed = 115200
monitor_filters = time, esp8266_exception_decoder

extra_scripts = post:merge_bin.py

; WiFi credentials are not compiled in: WiFiManager opens a
; "WiFiRadar-Setup" access point on first boot (or after /resetwifi) so you
; configure WiFi from a phone/laptop, and it saves the choice to flash.

; ---- Bare ESP-01 / ESP-01S (1 MB flash) ----
[env:esp01_1m]
board = esp01_1m
board_build.flash_size = 1MB
board_build.flash_mode = dout        ; ESP-01 modules often can't boot DIO/QIO images
board_build.f_flash = 40000000L
board_build.ldscript = eagle.flash.1m64.ld   ; 1 MB: 64 KB LittleFS + OTA-sized sketch area
; If the build fails with "section will not fit in region irom0_0_seg" the
; firmware is too big for this layout. Switch the ldscript to
; eagle.flash.1m.ld (no filesystem, ~1 MB for the sketch; settings from the
; /config page then won't persist) or use a 4 MB module with the esp12e env.

; ---- 4 MB modules: ESP-12E/F, NodeMCU, Wemos D1 mini, ESP-07 ----
[env:esp12e]
board = esp12e
board_build.flash_size = 4MB
